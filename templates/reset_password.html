<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ — Stock Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#f0f2f8;--surface:#fff;--border:#e2e5f0;--accent:#7c5cfc;--accent2:#a78bfa;--text:#1e1b3a;--muted:#8b8fa8;--danger:#ef4444;--success:#10b981}
        body{font-family:'Kanit',sans-serif;background:var(--bg);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--text)}
        body::before{content:'';position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(124,92,252,.12) 0%,transparent 70%);top:-120px;left:-120px}
        .card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:36px 32px;box-shadow:0 8px 40px rgba(124,92,252,.1),0 1px 3px rgba(0,0,0,.06)}
        .logo{width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;box-shadow:0 8px 24px rgba(124,92,252,.35)}
        h1{font-size:22px;font-weight:900;text-align:center;margin-bottom:6px}
        .subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.6}
        .field{margin-bottom:14px}
        .field-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
        .input-wrap{position:relative}
        .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
        .eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted);padding:0}
        input{width:100%;background:#f8f9fe;border:1px solid var(--border);border-radius:14px;padding:13px 16px 13px 42px;font-family:'Kanit',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s,background .2s}
        input.has-eye{padding-right:44px}
        input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(124,92,252,.1)}
        input::placeholder{color:#b8bdd4}
        .strength-bar{height:3px;border-radius:2px;margin-top:6px;overflow:hidden;background:#e8eaf5}
        .strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
        .strength-label{font-size:11px;margin-top:4px}
        .match-hint{font-size:11px;margin-top:4px;min-height:16px}
        .err{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px 16px;font-size:13px;color:var(--danger);margin-bottom:14px;display:none}
        .err.show{display:block}
        .btn{width:100%;padding:15px;border:none;border-radius:14px;font-family:'Kanit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 20px rgba(124,92,252,.3)}
        .btn-primary:hover:not(:disabled){transform:translateY(-1px)}
        .btn-primary:active:not(:disabled){transform:scale(.98)}
        .btn-primary:disabled{opacity:.45;cursor:not-allowed}
        /* invalid token state */
        .invalid-box{background:#fef2f2;border:1px solid #fecaca;border-radius:16px;padding:24px;text-align:center;display:none}
        .invalid-box.show{display:block}
        /* success state */
        .success-wrap{display:none;text-align:center}
        .success-wrap.show{display:block}
        .success-icon{width:72px;height:72px;background:linear-gradient(135deg,#059669,#34d399);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;box-shadow:0 8px 24px rgba(16,185,129,.3);animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
        @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
        @media(max-width:440px){.card{padding:28px 20px;border-radius:24px}}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">&#128272;</div>

    <!-- ถ้า token ไม่ valid -->
    <div class="invalid-box" id="invalid-box">
        <p style="font-size:32px;margin-bottom:12px">&#9888;&#65039;</p>
        <h1 style="font-size:18px;margin-bottom:8px">ลิงก์ไม่ถูกต้องหรือหมดอายุ</h1>
        <p style="font-size:13px;color:var(--muted);margin-bottom:20px">ลิงก์รีเซ็ตรหัสผ่านมีอายุ 30 นาที<br>กรุณาขอลิงก์ใหม่อีกครั้ง</p>
        <a href="/" style="display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:12px 28px;border-radius:14px;font-weight:700;font-size:14px;text-decoration:none">กลับหน้าเข้าสู่ระบบ</a>
    </div>

    <!-- ฟอร์มตั้งรหัสใหม่ -->
    <div id="reset-form">
        <h1>ตั้งรหัสผ่านใหม่</h1>
        <p class="subtitle" id="reset-email-display">กำลังตรวจสอบ...</p>
        <div class="err" id="err-reset"></div>
        <div class="field">
            <div class="field-label">รหัสผ่านใหม่</div>
            <div class="input-wrap">
                <span class="input-icon">&#128274;</span>
                <input type="password" id="new-password" class="has-eye" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password" oninput="checkStrength()">
                <button class="eye-btn" onclick="toggleEye('new-password',this)" tabindex="-1">&#128065;&#65039;</button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <div class="strength-label" id="strength-label"></div>
        </div>
        <div class="field">
            <div class="field-label">ยืนยันรหัสผ่านใหม่</div>
            <div class="input-wrap">
                <span class="input-icon">&#128271;</span>
                <input type="password" id="confirm-password" class="has-eye" placeholder="พิมพ์รหัสผ่านอีกครั้ง" autocomplete="new-password" oninput="checkMatch()">
                <button class="eye-btn" onclick="toggleEye('confirm-password',this)" tabindex="-1">&#128065;&#65039;</button>
            </div>
            <div class="match-hint" id="match-hint"></div>
        </div>
        <button class="btn btn-primary" id="btn-reset" onclick="submitReset()" style="margin-top:8px">
            <span id="btn-reset-label">บันทึกรหัสผ่านใหม่</span><span>&#10003;</span>
        </button>
    </div>

    <!-- สำเร็จ -->
    <div class="success-wrap" id="success-wrap">
        <div class="success-icon">&#10003;</div>
        <h1>เปลี่ยนรหัสผ่านสำเร็จ!</h1>
        <p class="subtitle">รหัสผ่านของคุณถูกอัปเดตแล้ว<br>กรุณาเข้าสู่ระบบด้วยรหัสใหม่</p>
        <a href="/" class="btn btn-primary" style="text-decoration:none;margin-top:8px">&#128273; ไปหน้าเข้าสู่ระบบ</a>
    </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');

function showErr(msg) { const e = document.getElementById('err-reset'); e.textContent = '⚠️ ' + msg; e.classList.add('show'); }
function hideErr() { document.getElementById('err-reset').classList.remove('show'); }

function toggleEye(id, btn) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
    btn.textContent = el.type === 'password' ? '👁️' : '🙈';
}

function checkStrength() {
    const pw = document.getElementById('new-password').value;
    const fill = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    let score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Za-z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const levels = [{w:'20%',bg:'#f87171',t:'อ่อนมาก'},{w:'40%',bg:'#fb923c',t:'อ่อน'},{w:'60%',bg:'#facc15',t:'ปานกลาง'},{w:'80%',bg:'#4ade80',t:'แข็งแรง'},{w:'100%',bg:'#34d399',t:'แข็งแรงมาก'}];
    const lv = levels[Math.min(score-1,4)] || levels[0];
    if (pw.length > 0) { fill.style.width=lv.w; fill.style.background=lv.bg; label.textContent='ความแข็งแรง: '+lv.t; label.style.color=lv.bg; }
    else { fill.style.width='0'; label.textContent=''; }
}

function checkMatch() {
    const pw = document.getElementById('new-password').value;
    const cf = document.getElementById('confirm-password').value;
    const hint = document.getElementById('match-hint');
    if (!cf) { hint.textContent=''; return; }
    if (pw===cf) { hint.textContent='✓ รหัสผ่านตรงกัน'; hint.style.color='var(--success)'; }
    else { hint.textContent='✗ รหัสผ่านไม่ตรงกัน'; hint.style.color='var(--danger)'; }
}

async function submitReset() {
    const pw = document.getElementById('new-password').value;
    const cf = document.getElementById('confirm-password').value;
    hideErr();
    if (!pw) return showErr('กรุณากรอกรหัสผ่านใหม่');
    if (pw.length < 6) return showErr('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
    if (pw !== cf) return showErr('รหัสผ่านไม่ตรงกัน');
    const btn = document.getElementById('btn-reset');
    btn.disabled = true;
    document.getElementById('btn-reset-label').textContent = 'กำลังบันทึก...';
    const res = await fetch('/api/reset-password', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({token, password: pw})
    });
    btn.disabled = false;
    document.getElementById('btn-reset-label').textContent = 'บันทึกรหัสผ่านใหม่';
    const data = await res.json();
    if (!res.ok) return showErr(data.error || 'เกิดข้อผิดพลาด');
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('success-wrap').classList.add('show');
}

// ตรวจ token ตอนโหลดหน้า
window.onload = async () => {
    if (!token) { showInvalid(); return; }
    const res = await fetch(`/api/verify-reset-token?token=${token}`);
    if (!res.ok) { showInvalid(); return; }
    const data = await res.json();
    document.getElementById('reset-email-display').textContent = 'ตั้งรหัสผ่านใหม่สำหรับ: ' + data.email;
    document.getElementById('new-password').focus();
};

function showInvalid() {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('invalid-box').classList.add('show');
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') submitReset(); });
</script>
</body>
</html>
