<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stock Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-purple-100">
        <div class="text-center mb-8">
            <div class="inline-block p-4 bg-purple-100 rounded-full mb-4">📦</div>
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">ระบบจัดการสต็อก</h1>
            <p class="text-gray-400 text-sm mt-1">กรุณาเข้าสู่ระบบเพื่อจัดการร้านค้า</p>
        </div>
        
        <div id="email-form" class="space-y-4">
            <input type="email" id="email" placeholder="example@gmail.com" class="w-full px-4 py-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-purple-400 outline-none transition-all">
            <button onclick="requestOTP()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">ขอรับรหัส OTP</button>
        </div>

        <div id="otp-form" class="hidden space-y-4">
            <input type="text" id="otp-code" maxlength="6" placeholder="รหัส OTP 6 หลัก" class="w-full px-4 py-4 text-center text-3xl tracking-[1rem] font-bold rounded-2xl border border-gray-200 focus:ring-2 focus:ring-purple-400 outline-none">
            <p class="text-center text-sm text-red-500 font-medium">หมดอายุใน: <span id="timer">02:00</span></p>
            <button onclick="verifyOTP()" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">ยืนยันเข้าสู่ระบบ</button>
        </div>
    </div>

    <script>
        let userEmail = '';
        async function requestOTP() {
            const email = document.getElementById('email').value;
            if (!email) return alert("กรุณากรอกอีเมล");
            const res = await fetch('/api/request-otp', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email})
            });
            if (res.ok) {
                userEmail = email;
                document.getElementById('email-form').classList.add('hidden');
                document.getElementById('otp-form').classList.remove('hidden');
                startTimer(120);
            } else {
                const data = await res.json();
                alert(data.error);
            }
        }

        async function verifyOTP() {
            const code = document.getElementById('otp-code').value;
            const res = await fetch('/api/verify-otp', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: userEmail, code})
            });
            if (res.ok) {
                window.location.href = '/dashboard'; // ย้ายไปหน้าแดชบอร์ด
            } else {
                const data = await res.json();
                alert(data.error);
            }
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timer');
            const interval = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                display.textContent = `${minutes < 10 ? "0" + minutes : minutes}:${seconds < 10 ? "0" + seconds : seconds}`;
                if (--timer < 0) { clearInterval(interval); display.textContent = "หมดเวลา"; }
            }, 1000);
        }
    </script>
</body>
</html>
