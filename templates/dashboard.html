<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Stock Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        
        /* แก้ไข UI ทับกัน: เว้นระยะด้านล่างให้ทุกหน้า */
        main { 
            padding-bottom: 220px !important; 
            min-height: 100vh;
        }

        /* จัดลำดับเลเยอร์ */
        nav { z-index: 100; } /* เมนูหลักอยู่บนสุด */
        .checkout-bar { bottom: 90px; z-index: 90; } /* แถบยอดเงินอยู่เหนือเมนู */
        .nav-active { color: #7e22ce; border-top: 3px solid #7e22ce; }

        /* ปรับแต่งปุ่มของตัวแสกน */
        #reader button { 
            background-color: #7e22ce !important; color: white !important; 
            border-radius: 12px !important; padding: 10px 20px !important;
            border: none !important; margin-top: 10px !important; font-size: 14px !important;
        }

        /* สไตล์ใบเสร็จ */
        .receipt-card {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 10px 10px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="bg-white/80 backdrop-blur-md p-4 shadow-sm sticky top-0 z-[110] border-b border-purple-100 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl">📦</span>
            <h1 id="page-title" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-700 to-blue-600">คลังสินค้า</h1>
        </div>
        <button onclick="location.href='/logout'" class="text-xs font-bold text-red-500 bg-red-50 px-4 py-2 rounded-full active:scale-90 transition-all">ออกจากระบบ</button>
    </header>

    <main id="page-1" class="p-4 space-y-3">
        <div id="product-list" class="grid gap-3">
            <div class="text-center p-20 text-gray-300">กำลังโหลดข้อมูลคลังสินค้า...</div>
        </div>
    </main>

    <main id="page-2" class="hidden p-4">
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-purple-50 space-y-5">
            <h3 class="text-lg font-bold text-gray-700 border-b pb-3">📥 รับสินค้าเข้าสต็อก</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 ml-2 uppercase">บาร์โค้ดสินค้า</label>
                    <input type="text" id="add-barcode" placeholder="สแกนหรือพิมพ์รหัส" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-400 transition-all">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 ml-2 uppercase">ชื่อสินค้า</label>
                    <input type="text" id="add-name" placeholder="ระบุชื่อสินค้า" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-400 transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 ml-2 uppercase">จำนวน</label>
                        <input type="number" id="add-qty" value="1" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-center font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 ml-2 uppercase">ราคาขาย (บาท)</label>
                        <input type="number" id="add-price" placeholder="0.00" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-center font-bold text-blue-600">
                    </div>
                </div>
                <button onclick="saveProduct()" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-5 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">✅ บันทึกเข้าสต็อก</button>
            </div>
        </div>
    </main>

    <main id="page-3" class="hidden p-4 space-y-4 relative">
        <div class="bg-black rounded-3xl overflow-hidden shadow-2xl aspect-[4/3] relative mx-auto max-w-md border-4 border-white">
            <div id="reader" class="w-full h-full"></div>
            <div id="scan-overlay" class="absolute inset-0 border-2 border-purple-500/30 m-10 rounded-2xl pointer-events-none transition-opacity duration-300"></div>
        </div>

        <div class="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-purple-100">
            <input type="text" id="manual-scan-input" placeholder="แสกนไม่ติด พิมพ์รหัสที่นี่..." class="flex-1 p-3 bg-gray-50 rounded-xl outline-none text-sm">
            <button onclick="addToCartFromInput()" class="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold active:scale-90 transition-all">เพิ่ม</button>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-blue-50 overflow-hidden">
            <div class="bg-blue-50/50 p-4 flex justify-between items-center border-b border-blue-100">
                <h3 class="font-bold text-blue-800 text-sm">🛒 รายการในบิลนี้</h3>
                <button onclick="clearCart()" class="text-[10px] text-red-500 font-bold bg-white px-3 py-1 rounded-full shadow-sm">ล้างบิล</button>
            </div>
            <div id="cart-list" class="divide-y divide-gray-50 max-h-[30vh] overflow-y-auto">
                <p class="text-center p-10 text-gray-300 italic text-sm">ยังไม่มีสินค้าในตะกร้า</p>
            </div>
        </div>

        <div class="checkout-bar fixed left-4 right-4 bg-white/95 backdrop-blur-md p-5 rounded-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] border border-purple-100 flex justify-between items-center">
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">ยอดรวมสุทธิ</p>
                <p class="text-2xl font-black text-purple-700">฿<span id="cart-total">0.00</span></p>
            </div>
            <button onclick="processCheckout()" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-4 rounded-2xl font-black shadow-lg shadow-purple-200 active:scale-95 transition-all">ยืนยันการขาย</button>
        </div>
    </main>

    <main id="page-4" class="hidden p-4 space-y-4">
        <div class="sticky top-[72px] bg-slate-50/90 backdrop-blur-md py-2 z-40">
            <div class="flex bg-white p-1 rounded-2xl shadow-sm border border-purple-100">
                <button id="btn-daily" onclick="loadReport('daily')" class="flex-1 py-3 rounded-xl text-sm font-bold bg-purple-600 text-white shadow-md transition-all">รายวัน</button>
                <button id="btn-monthly" onclick="loadReport('monthly')" class="flex-1 py-3 rounded-xl text-sm font-bold text-gray-400 transition-all">รายเดือน</button>
            </div>
        </div>
        <div id="report-list" class="space-y-4">
            </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around p-3 pb-8 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
        <button onclick="switchPage(1, 'คลังสินค้า')" id="nav-1" class="flex flex-col items-center flex-1 nav-active transition-all">
            <span class="text-xl">📦</span><span class="text-[10px] font-bold">คลัง</span>
        </button>
        <button onclick="switchPage(2, 'เพิ่มสต็อก')" id="nav-2" class="flex flex-col items-center flex-1 text-gray-300 transition-all">
            <span class="text-xl">➕</span><span class="text-[10px] font-bold">เพิ่ม</span>
        </button>
        <button onclick="switchPage(3, 'แสกนขาย')" id="nav-3" class="flex flex-col items-center flex-1 text-gray-300 transition-all">
            <span class="text-xl">📸</span><span class="text-[10px] font-bold">ขาย</span>
        </button>
        <button onclick="switchPage(4, 'สรุปยอด')" id="nav-4" class="flex flex-col items-center flex-1 text-gray-300 transition-all">
            <span class="text-xl">📊</span><span class="text-[10px] font-bold">รายงาน</span>
        </button>
    </nav>

    <script>
        let cart = [];
        let html5QrScanner = null;
        let isScanningAllowed = true;

        function switchPage(pageNum, title) {
            [1,2,3,4].forEach(n => {
                document.getElementById(`page-${n}`).classList.add('hidden');
                document.getElementById(`nav-${n}`).classList.remove('nav-active', 'text-purple-600');
                document.getElementById(`nav-${n}`).classList.add('text-gray-300');
            });
            document.getElementById(`page-${pageNum}`).classList.remove('hidden');
            document.getElementById(`nav-${pageNum}`).classList.add('nav-active', 'text-purple-600');
            document.getElementById(`nav-${pageNum}`).classList.remove('text-gray-300');
            document.getElementById('page-title').innerText = title;

            // จัดการเรื่องโหลดข้อมูลและกล้อง
            if(pageNum === 1) loadProducts();
            if(pageNum === 3) initScanner(); else stopScanner();
            if(pageNum === 4) loadReport('daily');
            
            window.scrollTo(0, 0);
        }

        // --- ระบบคลังสินค้า ---
        async function loadProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const list = document.getElementById('product-list');
            list.innerHTML = products.length ? products.map(p => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-purple-50 flex justify-between items-center transition-transform active:scale-95">
                    <div class="flex-1">
                        <p class="font-bold text-gray-800 text-lg leading-tight">${p.name}</p>
                        <p class="text-[10px] text-gray-400 font-mono">BC: ${p.barcode}</p>
                        <p class="text-blue-600 font-black mt-1">฿${p.price.toLocaleString()}</p>
                    </div>
                    <div class="bg-purple-50 text-purple-700 px-4 py-2 rounded-2xl text-center min-w-[90px]">
                        <span class="block text-[9px] font-bold uppercase tracking-tighter mb-0.5">ในสต็อก</span>
                        <span class="text-2xl font-black">${p.quantity}</span>
                    </div>
                </div>
            `).join('') : '<div class="text-center py-20 text-gray-300 italic">ไม่มีข้อมูลสินค้า</div>';
        }

        async function saveProduct() {
            const data = {
                barcode: document.getElementById('add-barcode').value,
                name: document.getElementById('add-name').value,
                quantity: document.getElementById('add-qty').value,
                price: document.getElementById('add-price').value
            };
            if(!data.barcode || !data.name) return alert("กรุณาระบุบาร์โค้ดและชื่อสินค้า");
            
            const res = await fetch('/api/products', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) {
                alert("บันทึกข้อมูลเรียบร้อย!");
                switchPage(1, 'คลังสินค้า');
                document.getElementById('add-barcode').value = '';
                document.getElementById('add-name').value = '';
                document.getElementById('add-price').value = '';
            }
        }

        // --- ระบบแสกนขาย (Cooldown 3 วิ) ---
        function initScanner() {
            if(!html5QrScanner) {
                html5QrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                html5QrScanner.render(handleScan);
            }
        }
        function stopScanner() { if(html5QrScanner) { html5QrScanner.clear(); html5QrScanner = null; } }

        async function handleScan(barcode) {
            if (!isScanningAllowed) return;
            isScanningAllowed = false;
            
            document.getElementById('reader').style.opacity = "0.4";
            
            const res = await fetch('/api/products');
            const products = await res.json();
            const product = products.find(p => p.barcode === barcode);
            
            if(product) {
                addItemToCart(product);
            } else {
                alert("ไม่พบสินค้า: " + barcode);
            }

            setTimeout(() => {
                isScanningAllowed = true;
                document.getElementById('reader').style.opacity = "1";
            }, 3000);
        }

        function addToCartFromInput() {
            const code = document.getElementById('manual-scan-input').value;
            if(code) { handleScan(code); document.getElementById('manual-scan-input').value = ''; }
        }

        function addItemToCart(product) {
            const existing = cart.find(i => i.barcode === product.barcode);
            if(existing) existing.qty += 1;
            else cart.push({ ...product, qty: 1 });
            renderCart();
        }

        function updateCartQty(idx, delta) {
            cart[idx].qty += delta;
            if(cart[idx].qty <= 0) cart.splice(idx, 1);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const totalBox = document.getElementById('cart-total');
            if(!cart.length) {
                list.innerHTML = '<p class="text-center p-10 text-gray-300 italic text-sm">ยังไม่มีสินค้าในบิล</p>';
                totalBox.innerText = "0.00";
                return;
            }
            let total = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += (item.price * item.qty);
                return `
                    <div class="p-4 flex justify-between items-center bg-white">
                        <div class="flex-1">
                            <p class="font-bold text-sm leading-tight">${item.name}</p>
                            <p class="text-xs text-blue-500 font-bold">฿${item.price.toLocaleString()} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="updateCartQty(${idx}, -1)" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-bold">-</button>
                            <span class="font-black text-sm w-4 text-center">${item.qty}</span>
                            <button onclick="updateCartQty(${idx}, 1)" class="w-8 h-8 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            totalBox.innerText = total.toLocaleString(undefined, {minimumFractionDigits: 2});
        }

        function clearCart() { if(confirm("ล้างบิลทั้งหมด?")) { cart = []; renderCart(); } }

        async function processCheckout() {
            if(!cart.length) return alert("กรุณาเพิ่มสินค้าก่อน");
            const payload = {
                transaction_id: "TX-" + Date.now(),
                items: cart.map(i => ({ barcode: i.barcode, name: i.name, qty: i.qty, price: i.price }))
            };
            const res = await fetch('/api/checkout', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                alert("บันทึกการขายสำเร็จ!");
                cart = [];
                renderCart();
                switchPage(1, 'คลังสินค้า');
            }
        }

        // --- ระบบรายงานและใบเสร็จ ---
        async function loadReport(mode) {
            const btnD = document.getElementById('btn-daily');
            const btnM = document.getElementById('btn-monthly');
            
            if(mode === 'daily') {
                btnD.className = 'flex-1 py-3 rounded-xl text-sm font-bold bg-purple-600 text-white shadow-md transition-all';
                btnM.className = 'flex-1 py-3 rounded-xl text-sm font-bold text-gray-400 transition-all';
            } else {
                btnM.className = 'flex-1 py-3 rounded-xl text-sm font-bold bg-purple-600 text-white shadow-md transition-all';
                btnD.className = 'flex-1 py-3 rounded-xl text-sm font-bold text-gray-400 transition-all';
            }

            const res = await fetch(`/api/sales-summary?mode=${mode}`);
            const data = await res.json();
            const list = document.getElementById('report-list');
            
            list.innerHTML = data.length ? data.map(r => `
                <div class="space-y-2">
                    <div onclick="toggleDetails('${r.label}')" class="bg-white p-5 rounded-2xl shadow-sm border border-purple-50 flex justify-between items-center active:bg-purple-50 transition-all cursor-pointer">
                        <div>
                            <p class="text-[9px] text-gray-400 font-bold uppercase">${mode === 'daily' ? 'วันที่' : 'เดือน'}</p>
                            <p class="font-bold text-gray-700">${r.label} <span class="text-[10px] text-purple-400 ml-1">▼ คลิกดูบิล</span></p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-gray-400 font-bold uppercase">ยอดรวม</p>
                            <p class="text-xl font-black text-green-600">฿${r.total.toLocaleString()}</p>
                        </div>
                    </div>
                    <div id="details-${r.label}" class="hidden space-y-3 pl-4 border-l-2 border-purple-200 ml-2 py-2"></div>
                </div>
            `).join('') : '<div class="text-center py-20 text-gray-300 italic">ยังไม่มีข้อมูลยอดขาย</div>';
        }

        async function toggleDetails(date) {
            const detailDiv = document.getElementById(`details-${date}`);
            if (!detailDiv.classList.contains('hidden')) { detailDiv.classList.add('hidden'); return; }

            detailDiv.classList.remove('hidden');
            detailDiv.innerHTML = '<p class="text-[10px] text-purple-400 animate-pulse">กำลังโหลดรายละเอียดบิล...</p>';
            
            const res = await fetch(`/api/sales-details?date=${date}`);
            const receipts = await res.json();

            detailDiv.innerHTML = Object.keys(receipts).length ? Object.keys(receipts).map(tid => {
                const r = receipts[tid];
                return `
                    <div class="bg-white p-4 rounded-2xl border-2 border-dashed border-gray-200 text-sm shadow-sm">
                        <div class="flex justify-between border-b border-gray-100 pb-2 mb-2">
                            <span class="font-bold text-gray-400 text-[9px]">ID: ${tid.substring(3, 13)}</span>
                            <span class="text-[10px] font-bold text-purple-500">${r.time} น.</span>
                        </div>
                        <div class="space-y-1.5">
                            ${r.items.map(i => `
                                <div class="flex justify-between text-[11px]">
                                    <span class="text-gray-600">${i.product_name} <span class="text-gray-400 font-mono">x${i.quantity}</span></span>
                                    <span class="font-bold text-gray-800">฿${i.total_price.toLocaleString()}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex justify-between border-t border-gray-100 mt-2 pt-2 font-black text-purple-700">
                            <span class="text-xs uppercase">รวมทั้งสิ้น</span>
                            <span class="text-sm underline decoration-double">฿${r.grand_total.toLocaleString()}</span>
                        </div>
                    </div>
                `;
            }).join('') : '<p class="text-xs text-gray-400">ไม่มีข้อมูลบิล</p>';
            
            detailDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
